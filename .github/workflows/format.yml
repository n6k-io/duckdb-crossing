name: Format
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same pin as extension-ci-tools' code-quality workflow, so this repo and
      # duckdb-virtual-catalog agree on what "formatted" means.
      - run: pip3 install 'clang_format==11.0.1'

      - run: make format-check
